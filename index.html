<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/notyf/3.10.0/notyf.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/notyf/3.10.0/notyf.min.js"></script>
    <title>INVENTARIO METROENERGY</title>
    <style>

        body{
        background:#f5f7fb;
        }

        .card{
            border-radius:18px;
        }

        .form-control,
        .form-select{
            border-radius:10px;
        }

        .form-control:focus,
        .form-select:focus{
            box-shadow:0 0 0 .2rem rgba(13,110,253,.15);
        }

        .card-header{
            padding:1.5rem;
        }

        textarea{
            resize:none;
        }

    </style>
</head>
<body>

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4">

        <div class="card-header bg-primary text-white rounded-top-4">

            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <h2 class="mb-0">
                        <i class="bi bi-pc-display-horizontal"></i>
                        Inventario de Activos Tecnológicos
                    </h2>

                    <small>Registro y administración de equipos</small>

                </div>

                <a href="#" class="btn btn-light">
                    <i class="bi bi-search"></i>
                    Consultar Activos
                </a>

            </div>

        </div>


        <div class="card-body p-4">

            <form id="formActivos">

                <h5 class="text-primary mb-3">
                    <i class="bi bi-person-fill"></i>
                    Responsable
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">Nombre Completo</label>

                        <input
                            id="idNombreResponsable"
                            name="nombre_responsable"
                            type="text"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">Departamento</label>

                        <select
                            id="idDepartamento"
                            name="departamento"
                            class="form-select"
                            required>

                            <option value="">Seleccione...</option>
                            <option>GHL (Mantenimiento)</option>
                            <option>RRHH</option>
                            <option>Contabilidad</option>
                            <option>Normativa</option>
                            <option>Unidad de Inspección</option>
                            <option>Comercial</option>
                            <option>Medición y Control</option>
                            <option>Marketing</option>
                            <option>Desarrollo</option>
                            <option>Procesos</option>
                            <option>Laboratorio</option>

                        </select>

                    </div>

                </div>

                <hr class="my-4">

                <h5 class="text-primary mb-3">
                    <i class="bi bi-laptop"></i>
                    Información del Equipo
                </h5>

                <div class="row g-3">
                    <div id="equiposContainer"></div>

                    <button
                        type="button"
                        id="btnAgregar"
                        class="btn btn-success w-100">
                        +
                    </button>
                </div>

                <hr class="my-4">
                
                <div id="credenciales">

                <h5 class="text-primary mb-3">
                    <i class="bi bi-shield-lock-fill"></i>
                    Credenciales de Acceso
                </h5>

                <div class="row g-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Correo Electrónico
                        </label>

                        <input
                            id="idCorreo"
                            name="correo"
                            type="email"
                            class="form-control"
                            placeholder="usuario@empresa.com">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Contraseña del Correo
                        </label>

                        <input
                            id="idPasswordCorreo"
                            name="password_correo"
                            type="password"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            PIN del Teléfono
                        </label>

                        <input
                            id="idPinTelefono"
                            name="pin_telefono"
                            type="password"
                            maxlength="10"
                            class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            PIN de Windows
                        </label>

                        <input
                            id="idPinComputadora"
                            name="pin_computadora"
                            type="password"
                            maxlength="20"
                            class="form-control">

                    </div>

                </div>
                </div>

                <hr class="my-4">


                <h5 class="text-primary mb-3">
                    <i class="bi bi-chat-left-text-fill"></i>
                    Observaciones
                </h5>

                <textarea
                    id="idObservacion"
                    name="observacion"
                    rows="5"
                    class="form-control"
                    placeholder="Escriba alguna observación..."
                    required></textarea>

                <div class="mt-4 d-flex justify-content-end gap-2">


                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-floppy-fill"></i>
                        Guardar Activo

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
    
</body>
